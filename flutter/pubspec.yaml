name: clevertap_native_display
description: Native Display SDK Flutter plugin for CleverTap — renders server-driven UI from JSON.
version: 0.1.0
homepage: https://github.com/CleverTap/clevertap-native-ui-kit

# Pure-Dart package: no native plugin, so the floor is driven purely by the
# transitive Flutter/Dart deps (the Android compileSdk 36 constraint is gone).
# The binding constraint is the caret MINIMUM of each dep, not the version that
# happens to resolve on a newer toolchain: webview_flutter 4.9.0 requires
# Flutter 3.24 / Dart 3.5 (video_player ^2.9.2 and url_launcher ^6.3.0 are
# lower — 3.16 — because a client on 3.24 resolves video_player 2.9.x, not the
# 2.10.1 that only newer toolchains pull). 3.24/3.5 is the honest minimum where
# a valid resolution exists; CI should confirm on a Flutter 3.24 toolchain.
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  webview_flutter: ^4.9.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
