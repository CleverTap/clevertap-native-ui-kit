name: clevertap_plugin_with_native_display
description: One-call CleverTap auto-wiring for CleverTap Native Display — bridges clevertap_plugin (Core SDK) to the pure-Dart Native Display renderer.
version: 1.0.0
homepage: https://github.com/CleverTap/clevertap-native-ui-kit
repository: https://github.com/CleverTap/clevertap-native-ui-kit
topics:
  - clevertap
  - native-display
  - analytics

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  clevertap_native_display: ^1.0.0
  clevertap_plugin: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Monorepo local development: resolve the core SDK from the sibling path instead
# of pub.dev. Overrides are ignored when this package is consumed as a published
# dependency, so the hosted ^1.0.0 constraint above is what ships.
dependency_overrides:
  clevertap_native_display:
    path: ../flutter
