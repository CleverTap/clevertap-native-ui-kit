name: clevertap_native_display_video
description: Optional VIDEO element renderer for CleverTap Native Display (video_player-backed add-on).
version: 0.1.0
homepage: https://github.com/CleverTap/clevertap-native-ui-kit

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  clevertap_native_display: ^0.1.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  plugin_platform_interface: ^2.1.8
  video_player_platform_interface: ^6.2.0

# Monorepo local development: resolve the core SDK from the sibling path instead
# of pub.dev. Overrides are ignored when this package is consumed as a published
# dependency, so the hosted ^0.1.0 constraint above is what ships.
dependency_overrides:
  clevertap_native_display:
    path: ../flutter
