name: clevertap_native_display_webview
description: Optional HTML element renderer for CleverTap Native Display (webview_flutter-backed add-on).
version: 1.0.0
homepage: https://github.com/CleverTap/clevertap-native-ui-kit

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  clevertap_native_display: ^1.0.0
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Monorepo local development: resolve the core SDK from the sibling path instead
# of pub.dev. Overrides are ignored when this package is consumed as a published
# dependency, so the hosted ^1.0.0 constraint above is what ships.
dependency_overrides:
  clevertap_native_display:
    path: ../flutter
