name: clevertap_native_display_sample
description: Sample app demonstrating the CleverTap Native Display Flutter plugin.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  clevertap_native_display:
    path: ../flutter
  # Optional element add-ons (VIDEO / HTML). Added here so the sample demos both;
  # a real host adds only the ones it needs.
  clevertap_native_display_video:
    path: ../flutter-video
  clevertap_native_display_webview:
    path: ../flutter-webview
  clevertap_plugin: ^4.1.0
  # Automation-only (ND_AUTOMATION): manifest I/O + cache warming. These are
  # pulled in by cached_network_image transitively, but we depend on them
  # directly so the automation code can import them.
  path_provider: ^2.1.0
  flutter_cache_manager: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/banners/
    - assets/configs/
    - assets/test-configs/
